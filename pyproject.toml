[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shift-scheduling"
version = "0.1.0"
description = "REST API for scheduling security agents onto shifts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["shift_scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
